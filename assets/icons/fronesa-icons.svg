<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fronesa icon set">
  <title>Fronesa icon set — editorial line icons</title>
  <defs>
    <!-- label / tag -->
    <symbol id="i-label" viewBox="0 0 24 24">
      <path d="M3 12 V4 a1 1 0 0 1 1-1 h8 l9 9-9 9-9-9 z" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="8" cy="8" r="1.6" fill="#1b1813"/>
    </symbol>
    <!-- fleet / layers -->
    <symbol id="i-fleet" viewBox="0 0 24 24">
      <path d="M12 3 3 8 l9 5 9-5-9-5 z" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M3 12 l9 5 9-5" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M3 16 l9 5 9-5" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <!-- calibration / gauge -->
    <symbol id="i-calibration" viewBox="0 0 24 24">
      <path d="M4 14 a8 8 0 0 1 16 0" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="14" x2="17" y2="9" stroke="#1b1813" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="14" r="1.6" fill="#1b1813"/>
      <line x1="3" y1="18" x2="21" y2="18" stroke="#1b1813" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <!-- budget / ledger -->
    <symbol id="i-budget" viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="18" fill="none" stroke="#1b1813" stroke-width="1.5"/>
      <line x1="4" y1="8" x2="20" y2="8" stroke="#1b1813" stroke-width="1.5"/>
      <line x1="8" y1="12" x2="16" y2="12" stroke="#1b1813" stroke-width="1.5"/>
      <line x1="8" y1="16" x2="13" y2="16" stroke="#1b1813" stroke-width="1.5"/>
    </symbol>
    <!-- alert / bell -->
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M6 16 v-5 a6 6 0 0 1 12 0 v5 l1.5 2.5 h-15 L6 16 z" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M10 21 a2 2 0 0 0 4 0" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <!-- learn / loop -->
    <symbol id="i-learn" viewBox="0 0 24 24">
      <path d="M20 12 a8 8 0 1 1-2.3-5.6" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M20 3 v4 h-4" fill="none" stroke="#1b1813" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>
