<title id="ts-title">Recall versus decision threshold, v4 held-out evaluation</title>
<desc id="ts-desc">Line chart: recall falls from 0.5625 at threshold 0.50 to zero at 0.80 and stays zero at the production value 0.90. The gate passes only at 0.50.</desc>
