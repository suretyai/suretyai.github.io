<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Page not found">
  <title>404 — not in the lab notes</title>
  <desc>Decorative 404 illustration in journal style: a missing page from the lab notes.</desc>
  <rect width="600" height="400" fill="#f4f1e8"/>
  <text x="300" y="170" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="120" fill="#1b1813">404</text>
  <line x1="180" y1="210" x2="420" y2="210" stroke="#d9d3bf" stroke-width="1"/>
  <text x="300" y="252" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="26" font-style="italic" fill="#1b1813">Not in the lab notes.</text>
  <text x="300" y="288" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#7d7869">This page was never measured, so we can't show it to you.</text>
  <rect x="292" y="316" width="16" height="16" transform="rotate(45 300 324)" fill="#0f5132"/>
</svg>
