<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="hrd-title hrd-desc">
  <title>How to read your decision</title>
  <desc>Annotated guide to reading a Fronesa decision receipt.</desc>
  <title id="hrd-title">How to read your decision — Fronesa</title>
  <desc id="hrd-desc">An annotated decision receipt. Numbered callouts explain each field in plain English: the decision ID for auditing, the label, the confidence score, and the model version with review status. All sample values are illustrated.</desc>

  <rect width="1200" height="660" fill="#f4f1e8"/>
  <rect x="24" y="24" width="1152" height="612" fill="none" stroke="#1b1813" stroke-width="2"/>
  <rect x="30" y="30" width="1140" height="600" fill="none" stroke="#1b1813" stroke-width="0.75"/>

  <!-- Masthead -->
  <text x="80" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" letter-spacing="6" fill="#1b1813">FRONESA · LAB NOTES</text>
  <text x="1120" y="100" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#7d7869">FIG. — THE RECEIPT</text>
  <line x1="80" y1="122" x2="1120" y2="122" stroke="#1b1813" stroke-width="1.5"/>
  <line x1="80" y1="128" x2="1120" y2="128" stroke="#1b1813" stroke-width="0.75"/>

  <!-- Title -->
  <text x="80" y="200" font-family="Fraunces, Georgia, serif" font-size="54" fill="#1b1813">How to read your decision.</text>
  <text x="80" y="244" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#57534a">Every field on the receipt, in plain English. Illustrated sample.</text>

  <!-- Receipt card (left) with numbered callouts -->
  <g>
    <rect x="80" y="290" width="400" height="300" fill="#ffffff" stroke="#1b1813" stroke-width="2"/>
    <line x1="80" y1="336" x2="480" y2="336" stroke="#1b1813" stroke-width="1"/>
    <text x="280" y="320" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#1b1813">DECISION RECEIPT</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <text x="110" y="376" fill="#7d7869">decision id</text>
      <text x="400" y="376" text-anchor="end" fill="#1b1813">d_8f3a2b1c</text>
      <text x="110" y="420" fill="#7d7869">label</text>
      <text x="400" y="420" text-anchor="end" font-weight="bold" fill="#0f5132">SPAM</text>
      <text x="110" y="464" fill="#7d7869">confidence</text>
      <text x="400" y="464" text-anchor="end" fill="#1b1813">0.93</text>
      <text x="110" y="508" fill="#7d7869">model · review</text>
      <text x="400" y="508" text-anchor="end" fill="#1b1813">v1 · not needed</text>
      <text x="110" y="552" fill="#7d7869">timestamp</text>
      <text x="400" y="552" text-anchor="end" font-size="13" fill="#57534a">2026-10-06 13:32 +03</text>
    </g>
    <!-- callout numbers -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="bold" text-anchor="middle">
      <circle cx="444" cy="371" r="12" fill="#1b1813"/><text x="444" y="376" fill="#f4f1e8">1</text>
      <circle cx="444" cy="415" r="12" fill="#1b1813"/><text x="444" y="420" fill="#f4f1e8">2</text>
      <circle cx="444" cy="459" r="12" fill="#1b1813"/><text x="444" y="464" fill="#f4f1e8">3</text>
      <circle cx="444" cy="503" r="12" fill="#1b1813"/><text x="444" y="508" fill="#f4f1e8">4</text>
    </g>
  </g>

  <!-- Legend (right) -->
  <g>
    <g>
      <circle cx="552" cy="312" r="14" fill="#1b1813"/>
      <text x="552" y="317" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#f4f1e8">1</text>
      <text x="584" y="308" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1b1813">The ID is the audit trail.</text>
      <text x="584" y="334" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#57534a">Quote it and we pull the full record — inputs, scores, version.</text>
    </g>
    <g>
      <circle cx="552" cy="392" r="14" fill="#1b1813"/>
      <text x="552" y="397" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#f4f1e8">2</text>
      <text x="584" y="388" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1b1813">The call: SPAM or HAM.</text>
      <text x="584" y="414" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#57534a">Nothing else. No scores hidden behind the label.</text>
    </g>
    <g>
      <circle cx="552" cy="472" r="14" fill="#1b1813"/>
      <text x="552" y="477" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#f4f1e8">3</text>
      <text x="584" y="468" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1b1813">How sure it was: 0.93.</text>
      <text x="584" y="494" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#57534a">Below 0.90 it would have abstained instead of guessing.</text>
    </g>
    <g>
      <circle cx="552" cy="552" r="14" fill="#1b1813"/>
      <text x="552" y="557" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#f4f1e8">4</text>
      <text x="584" y="548" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1b1813">v1 decided; no human needed.</text>
      <text x="584" y="574" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#57534a">When unsure, a reviewer steps in — the correction teaches the next version.</text>
    </g>
  </g>
</svg>
