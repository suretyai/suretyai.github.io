<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="tb-title tb-desc">
<title id="tb-title">Two benches.</title>
<desc id="tb-desc">Comparison of the try-it page's two benches: Bench A runs ten fixed pre-computed outputs from the v3 sentiment model with no key needed; Bench B calls the live /decide endpoint serving the production spam-v1 model and needs an API key.</desc>
<rect width="1200" height="560" fill="#f4f1e8"/>
<text x="80" y="72" font-family="Fraunces, Georgia, serif" font-size="36" fill="#1b1813">Two benches.</text>
<text x="80" y="104" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#7d7869">Same mechanism — decision + confidence + escalation. Different model, different stakes.</text>
<rect x="80" y="140" width="480" height="340" fill="#faf8f1" stroke="#1b1813" stroke-width="1.5"/>
<text x="108" y="182" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#0f5132">BENCH A — PRE-COMPUTED</text>
<text x="108" y="218" font-family="Fraunces, Georgia, serif" font-size="26" fill="#1b1813">The demo</text>
<line x1="108" y1="236" x2="532" y2="236" stroke="#d9d3bf" stroke-width="1"/>
<text x="108" y="268" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">input</text>
<text x="108" y="292" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">10 hand-picked messages, fixed</text>
<text x="108" y="324" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">model</text>
<text x="108" y="348" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">v3 sentiment · ModernBERT + LoRA</text>
<text x="108" y="380" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">cost of trying</text>
<text x="108" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">none — no key, tap a chip</text>
<text x="108" y="436" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">purpose</text>
<text x="108" y="460" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">illustrates the mechanism</text>
<rect x="640" y="140" width="480" height="340" fill="#faf8f1" stroke="#1b1813" stroke-width="1.5"/>
<text x="668" y="182" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#a83c24">BENCH B — LIVE</text>
<text x="668" y="218" font-family="Fraunces, Georgia, serif" font-size="26" fill="#1b1813">The endpoint</text>
<line x1="668" y1="236" x2="1092" y2="236" stroke="#d9d3bf" stroke-width="1"/>
<text x="668" y="268" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">input</text>
<text x="668" y="292" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">your own text, typed live</text>
<text x="668" y="324" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">model</text>
<text x="668" y="348" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">production spam-v1 · spam/ham labels</text>
<text x="668" y="380" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">cost of trying</text>
<text x="668" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">API key — surety.ai@proton.me</text>
<text x="668" y="436" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#7d7869">purpose</text>
<text x="668" y="460" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1b1813">a real decision back</text>
<line x1="600" y1="140" x2="600" y2="480" stroke="#d9d3bf" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="548" y="288" width="104" height="44" fill="#f4f1e8" stroke="#7d7869" stroke-width="1"/>
<text x="600" y="316" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#1b1813">same loop</text>
<line x1="80" y1="508" x2="1120" y2="508" stroke="#d9d3bf" stroke-width="1"/>
<text x="80" y="532" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#7d7869">Bench A never touches the production model; Bench B never runs without your key. Both show the same three things: the call, the confidence, whether a human had to step in.</text>
</svg>